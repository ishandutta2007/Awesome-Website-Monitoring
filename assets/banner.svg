<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Awesome Website Monitoring banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- animated heartbeat line -->
  <g filter="url(#glow)">
    <polyline fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      points="80,200 160,200 180,200 200,150 220,250 240,200 320,200 340,200 360,150 380,250 400,200 480,200 500,200 520,150 540,250 560,200 640,200 660,200 680,150 700,250 720,200 800,200 820,200 840,150 860,250 880,200 960,200 980,200 1000,150 1020,250 1040,200 1120,200">
      <animate attributeName="points" dur="3s" repeatCount="indefinite"
        values="80,200 160,200 180,200 200,150 220,250 240,200 320,200 340,200 360,150 380,250 400,200 480,200 500,200 520,150 540,250 560,200 640,200 660,200 680,150 700,250 720,200 800,200 820,200 840,150 860,250 880,200 960,200 980,200 1000,150 1020,250 1040,200 1120,200;
                80,200 160,200 180,200 200,250 220,150 240,200 320,200 340,200 360,250 380,150 400,200 480,200 500,200 520,250 540,150 560,200 640,200 660,200 680,250 700,150 720,200 800,200 820,200 840,250 860,150 880,200 960,200 980,200 1000,250 1020,150 1040,200 1120,200;
                80,200 160,200 180,200 200,150 220,250 240,200 320,200 340,200 360,150 380,250 400,200 480,200 500,200 520,150 540,250 560,200 640,200 660,200 680,150 700,250 720,200 800,200 820,200 840,150 860,250 880,200 960,200 980,200 1000,150 1020,250 1040,200 1120,200"/>
    </polyline>
  </g>

  <!-- animated pulse dots -->
  <circle cx="200" cy="200" r="5" fill="#34d399">
    <animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="200" r="5" fill="#fbbf24">
    <animate attributeName="r" values="5;9;5" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="200" r="5" fill="#f87171">
    <animate attributeName="r" values="5;9;5" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- uptime bars -->
  <g>
    <rect x="80" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="310" width="22" height="50" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="50;55;50" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="290" width="22" height="70" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="70;65;70" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="188" y="305" width="22" height="55" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="55;60;55" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="224" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" y="315" width="22" height="45" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="45;40;45" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="296" y="320" width="22" height="40" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="40;35;40" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="332" y="310" width="22" height="50" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="50;45;50" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="368" y="285" width="22" height="75" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="75;70;75" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="404" y="300" width="22" height="60" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="440" y="335" width="22" height="25" rx="4" fill="url(#bar3)">
      <animate attributeName="height" values="25;20;25" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="476" y="325" width="22" height="35" rx="4" fill="url(#bar3)">
      <animate attributeName="height" values="35;30;35" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="512" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="548" y="295" width="22" height="65" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="65;60;65" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="584" y="308" width="22" height="52" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="52;56;52" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="620" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="656" y="288" width="22" height="72" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="72;68;72" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="692" y="312" width="22" height="48" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="48;44;48" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="728" y="300" width="22" height="60" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="764" y="318" width="22" height="42" rx="4" fill="url(#bar3)">
      <animate attributeName="height" values="42;38;42" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="836" y="292" width="22" height="68" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="68;64;68" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="872" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="908" y="330" width="22" height="30" rx="4" fill="url(#bar2)">
      <animate attributeName="height" values="30;26;30" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="944" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="980" y="305" width="22" height="55" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="55;58;55" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1016" y="298" width="22" height="62" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="62;60;62" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1052" y="300" width="22" height="60" rx="4" fill="url(#bar1)">
      <animate attributeName="height" values="60;60;60" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- titles -->
  <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff">
    Awesome Website Monitoring
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#94a3b8">
    Uptime Checks · Synthetic Monitoring · Status Pages · Alerting · Observability
    <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
  </text>

  <!-- status pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <rect x="360" y="345" width="90" height="28" rx="14" fill="#064e3b"/>
    <circle cx="378" cy="359" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="390" y="364" fill="#6ee7b7">Operational</text>

    <rect x="470" y="345" width="90" height="28" rx="14" fill="#78350f"/>
    <circle cx="488" cy="359" r="5" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="364" fill="#fcd34d">Degraded</text>

    <rect x="580" y="345" width="70" height="28" rx="14" fill="#7f1d1d"/>
    <circle cx="598" cy="359" r="5" fill="#f87171">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="607" y="364" fill="#fca5a5">Down</text>
  </g>
</svg>
